<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  
  <!-- Confetti Library for particle effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); */
    background-color: #1a0b12;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Gift Box Container */
    .gift-container {
      cursor: pointer;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .gift-container:hover {
      transform: scale(1.05);
    }

    /* Gift Box Icon / Emoji Styling */
    .gift-box {
      font-size: 100px;
      animation: bounce 1.5s infinite alternate;
    }
    img{
        height: 250px;
        width: 250px;
        object-fit: cover;
        border-radius: 50%;
    }

    .tap-text {
      color: #ce7f9c;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    /* Birthday Content (Initially Hidden) */
    .birthday-card {
      display: none;
      text-align: center;
      animation: fadeIn 1s ease-in-out forwards;
    }

    .cake {
      font-size: 90px;
      margin-bottom: 10px;
    }

    h1 {
      color: #ce7f9c;
      font-size: 2.8rem;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    p {
      color: blanchedalmond;
      font-size: 1.2rem;
      max-width: 400px;
      line-height: 1.5;
    }
    .btn{
        position: absolute;
    bottom: 20px;
    right: 20px;
    /* Theme Styles (Card ke matching colors) */
    background-color: #a7676d; /* Warm romantic red/pink hue */
    color: #ffffff;
    font-family: inherit; /* Card wala same font use hoga */
    font-size: 14px;
    font-weight: 500;
    
    /* Shape & Borders */
    padding: 10px 20px;
    border: none;
    border-radius: 25px; /* Pill shape jo card ke soft edges se match karti hai */
    
    /* Interactive Effects */
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3); /* Subtle glow effect */
    transition: all 0.3s ease;
    }
    .btn:hover{
       background-color: #ff4d5a;
    transform: translateY(-2px); /* Slight lift */
    box-shadow: 0 6px 16px rgba(230, 57, 70, 0.5);
    }

    /* Animations */
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-15px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
   
    @media (max-width: 480px){
      .btn {
        font-size: 16px;
        margin: 10px 10;
        padding: 10px 10px;
        letter-spacing: 6px;

    }
    }
  </style>
</head>
<body>

  <!-- Screen 1: Clickable Gift Box -->
  <div class="gift-container" id="giftSection" onclick="openGift()">
    <div class="gift-box">🎁</div>
    <div class="tap-text">Tap the gift to open!</div>
  </div>

  <!-- Screen 2: Birthday Message (Hidden by default) -->
  <div class="birthday-card" id="birthdayCard">
    <!-- <div class="cake">🎂</div> -->
    <div class="cake">
        <img src="anny.jpg.jpeg" alt="" srcset="">
    </div>
    <h1>Happy anniversary! 🎉</h1>
    <!-- <img src="c:\Users\hp\Downloads\WhatsApp Image 2026-08-08 at 12.45.18 PM.jpeg" alt="" srcset=""> -->
    <p>Wishing you a day filled with love, laughter, and endless happiness! ✨</p>
  </div>
 <form action="main.html" method="get">
     <button class="btn" onclick="showSurprise()">Click Me!
    </button>
  <script>
    function openGift() {
      // 1. Hide the gift box
      document.getElementById('giftSection').style.display = 'none';

      // 2. Show the  Message
      document.getElementById('birthdayCard').style.display = 'block';

      // 3. Trigger Confetti Blast
      var count = 200;
      var defaults = {
        origin: { y: 0.7 }
      };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, { spread: 26, startVelocity: 55 });
      fire(0.2, { spread: 60 });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }
  </script>

</body>
</html>
